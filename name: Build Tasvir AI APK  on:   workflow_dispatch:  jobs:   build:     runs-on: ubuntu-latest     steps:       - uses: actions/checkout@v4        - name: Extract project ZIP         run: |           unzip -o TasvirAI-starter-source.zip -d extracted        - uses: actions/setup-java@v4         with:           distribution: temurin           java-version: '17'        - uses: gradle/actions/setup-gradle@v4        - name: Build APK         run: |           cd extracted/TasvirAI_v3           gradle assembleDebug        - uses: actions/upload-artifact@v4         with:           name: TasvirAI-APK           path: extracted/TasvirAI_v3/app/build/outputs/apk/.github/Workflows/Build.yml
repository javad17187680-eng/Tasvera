name: Build Tasvir AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o TasvirAI-starter-source.zip -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd extracted/TasvirAI_v3
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TasvirAI-APK
          path: extracted/TasvirAI_v3/app/build/outputs/apk/debug/*.apk
